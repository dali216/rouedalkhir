<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Mes certificats — Roued Al Khair</title>

  <link rel="stylesheet" href="style.css">

  <style>
    .certificates-page {
      max-width: 1000px;
      margin: 0 auto;
      padding: 40px 20px;
    }

    .page-header {
      margin-bottom: 30px;
    }

    .page-header h1 {
      margin-bottom: 8px;
    }

    .back-link {
      display: inline-block;
      margin-bottom: 25px;
      text-decoration: none;
    }

    .certificates-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 20px;
    }

    .certificate-card {
      padding: 24px;
      border-radius: 20px;
    }

    .certificate-icon {
      font-size: 40px;
      margin-bottom: 15px;
    }

    .certificate-card h3 {
      margin: 0 0 10px;
    }

    .certificate-description {
      opacity: .8;
      line-height: 1.6;
      margin-bottom: 15px;
    }

    .certificate-date {
      font-size: 14px;
      opacity: .7;
      margin-bottom: 18px;
    }

    .certificate-btn {
      display: inline-block;
      text-decoration: none;
      cursor: pointer;
    }

    .empty-state {
      text-align: center;
      padding: 50px 20px;
      border-radius: 20px;
    }

    #msg {
      display: block;
      margin: 20px 0;
    }
  </style>
</head>

<body>

<div class="certificates-page">

  <a href="dashboard.html" class="back-link">
    ← Retour au dashboard
  </a>

  <div class="page-header">
    <span class="eyebrow">Espace bénévole</span>

    <h1>
      Mes <span>certificats</span>
    </h1>

    <p>
      Retrouvez ici vos certificats délivrés par
      l'association Roued Al Khair.
    </p>
  </div>

  <span id="msg">⏳ Chargement...</span>

  <div id="certificates"
       class="certificates-grid">
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="app.js"></script>

<script>

async function loadCertificates() {

  const msg =
    document.getElementById("msg");

  const container =
    document.getElementById("certificates");

  const user =
    await requireAuth();

  if (!user) return;

  const {
    data: certificates,
    error
  } =
    await supabaseClient
      .from("certificates")
      .select("*")
      .eq("user_id", user.id)
      .order("issued_at", {
        ascending: false
      });

  if (error) {

    console.error(error);

    msg.innerHTML =
      "❌ Erreur lors du chargement.";

    return;
  }

  msg.innerHTML = "";

  if (!certificates ||
      certificates.length === 0) {

    container.innerHTML = `
      <div class="empty-state glass">

        <div class="certificate-icon">
          🏆
        </div>

        <h2>
          Aucun certificat
        </h2>

        <p>
          Vos certificats apparaîtront ici
          lorsqu'ils seront délivrés par
          l'association.
        </p>

      </div>
    `;

    return;
  }

  for (const cert of certificates) {

    let pdfButton = "";

    if (cert.file_path) {

      const {
        data: signedData,
        error: signedError
      } =
        await supabaseClient
          .storage
          .from("certificates")
          .createSignedUrl(
            cert.file_path,
            3600
          );

      if (!signedError &&
          signedData?.signedUrl) {

        pdfButton = `
          <a
            class="btn certificate-btn"
            href="${signedData.signedUrl}"
            target="_blank"
            rel="noopener"
          >
            📄 Voir le certificat
          </a>
        `;
      }
    }

    const date =
      cert.issued_at
        ? new Date(cert.issued_at)
            .toLocaleDateString("fr-FR")
        : "";

    container.innerHTML += `

      <div class="certificate-card glass">

        <div class="certificate-icon">
          🏆
        </div>

        <h3>
          ${escapeHtml(cert.title)}
        </h3>

        ${
          cert.description
            ? `
              <div class="certificate-description">
                ${escapeHtml(cert.description)}
              </div>
            `
            : ""
        }

        <div class="certificate-date">
          📅 Délivré le ${date}
        </div>

        ${
          pdfButton ||
          `<span style="opacity:.6">
             📄 PDF non disponible
           </span>`
        }

      </div>

    `;
  }
}


function escapeHtml(value) {

  return String(value ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}


loadCertificates();

</script>

</body>
</html>
