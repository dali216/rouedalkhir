<!doctype html>
<html lang="fr">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Créer un compte — Roued Al Khair</title><link rel="stylesheet" href="style.css"></head>
<body class="auth-page">
<div class="auth glass">
<a class="back" href="login.html">← Retour</a>
<div class="logo big">RK</div>
<span class="eyebrow">Espace bénévole</span>
<h1>Créer votre<br><span>compte.</span></h1>
<p>Rejoignez l'équipe de bénévoles de Roued Al Khair.</p>
<form id="register">
<label for="name">Nom complet</label><input id="name" required placeholder="Votre nom complet">
<label for="email">Email</label><input id="email" type="email" required placeholder="vous@email.com">
<label for="password">Mot de passe</label><input id="password" type="password" minlength="6" required placeholder="Minimum 6 caractères">
<button class="btn" type="submit">Créer mon compte →</button>
</form>
<small id="msg"></small>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="app.js"></script>
</body></html>
