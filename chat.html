<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1">

  <title>Chat — Roued Al Khair</title>

  <link rel="stylesheet" href="style.css">

  <style>
    .chat-page {
      max-width: 900px;
      margin: 30px auto;
      padding: 15px;
    }

    .chat-header {
      padding: 20px;
      margin-bottom: 15px;
    }

    .chat-header h1 {
      margin: 15px 0 5px;
    }

    .chat-header p {
      opacity: .7;
    }

    .chat-box {
      height: 60vh;
      min-height: 400px;
      overflow-y: auto;
      padding: 20px;
      border-radius: 20px;
    }

    .message {
      display: flex;
      margin-bottom: 12px;
    }

    .message.mine {
      justify-content: flex-end;
    }

    .bubble {
      max-width: 75%;
      padding: 12px 16px;
      border-radius: 17px;
      background: white;
      box-shadow: 0 3px 12px rgba(0,0,0,.06);
    }

    .mine .bubble {
      background: #111;
      color: white;
    }

    .text {
      white-space: pre-wrap;
      word-break: break-word;
    }

    .sender {
      font-size: 11px;
      font-weight: bold;
      margin-bottom: 5px;
      opacity: .65;
    }

    .time {
      font-size: 10px;
      opacity: .55;
      margin-top: 6px;
      text-align: right;
    }

    .empty {
      text-align: center;
      padding: 60px 20px;
      opacity: .6;
    }

    .chat-form {
      display: flex;
      gap: 10px;
      margin-top: 15px;
      padding: 15px;
      border-radius: 20px;
    }

    #messageInput {
      flex: 1;
      min-height: 50px;
      resize: vertical;
      padding: 12px;
      border-radius: 12px;
      border: 1px solid #ddd;
      font-family: inherit;
      font-size: 15px;
    }

    #sendBtn {
      border: none;
      border-radius: 12px;
      padding: 0 22px;
      cursor: pointer;
      font-weight: bold;
    }

    #status {
      text-align: center;
      margin-top: 8px;
      font-size: 13px;
    }

    .error {
      color: #b00020;
      opacity: 1;
    }
  </style>
</head>

<body>

<main class="chat-page">

  <div class="glass chat-header">

    <a href="dashboard.html">
      ← Retour
    </a>

    <h1>💬 Chat des membres</h1>

    <p>
      Espace de discussion de Roued Al Khair
    </p>

  </div>


  <div id="chatBox" class="glass chat-box">

    <div id="empty" class="empty">
      ⏳ Chargement des messages...
    </div>

  </div>


  <form id="chatForm" class="glass chat-form">

    <textarea
      id="messageInput"
      placeholder="Écrire un message..."
      maxlength="1000"
      required
    ></textarea>

    <button
      id="sendBtn"
      type="submit"
    >
      Envoyer
    </button>

  </form>

  <div id="status"></div>

</main>


<!-- SUPABASE -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<!-- APP -->
<script src="app.js"></script>


<script>

let currentUser = null;


/* =========================
   ESCAPE HTML
========================= */

function escapeHTML(value) {

  if (value === null || value === undefined) {
    return "";
  }

  return String(value)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}


/* =========================
   LOAD CHAT
========================= */

async function loadMessages() {

  const chatBox = document.getElementById("chatBox");

  try {

    chatBox.innerHTML = `
      <div class="empty">
        ⏳ Chargement des messages...
      </div>
    `;


    /* Vérifier utilisateur */

    const {
      data: {
        user
      },
      error: userError
    } = await supabaseClient.auth.getUser();


    if (userError) {
      throw userError;
    }


    if (!user) {

      chatBox.innerHTML = `
        <div class="empty error">
          ❌ Vous devez être connecté.
        </div>
      `;

      return;
    }


    currentUser = user;


    /* Récupérer les messages */

    const {
      data,
      error
    } = await supabaseClient
      .from("public_chat_messages")
      .select(`
        id,
        user_id,
        message,
        created_at
      `)
      .order("created_at", {
        ascending: true
      });


    console.log("CHAT DATA:", data);
    console.log("CHAT ERROR:", error);


    if (error) {
      throw error;
    }


    /* Aucun message */

    if (!data || data.length === 0) {

      chatBox.innerHTML = `
        <div class="empty">
          💬 Aucun message pour le moment.<br>
          Soyez le premier à écrire !
        </div>
      `;

      return;
    }


    /* Affichage */

    chatBox.innerHTML = data.map(msg => {

      const mine =
        msg.user_id === currentUser.id;


      const date =
        new Date(msg.created_at);


      return `
        <div class="message ${mine ? "mine" : ""}">

          <div class="bubble">

            <div class="sender">
              ${mine ? "Vous" : "Membre"}
            </div>

            <div class="text">
              ${escapeHTML(msg.message)}
            </div>

            <div class="time">
              ${date.toLocaleString("fr-FR")}
            </div>

          </div>

        </div>
      `;

    }).join("");


    /* Scroll vers le bas */

    chatBox.scrollTop =
      chatBox.scrollHeight;

  }

  catch (error) {

    console.error(
      "CHAT ERROR:",
      error
    );


    chatBox.innerHTML = `
      <div class="empty error">

        ❌ Erreur de chargement des messages.

        <br><br>

        <small>
          ${escapeHTML(error.message)}
        </small>

      </div>
    `;
  }
}


/* =========================
   SEND MESSAGE
========================= */

async function sendMessage() {

  const input =
    document.getElementById("messageInput");

  const button =
    document.getElementById("sendBtn");

  const status =
    document.getElementById("status");


  const message =
    input.value.trim();


  if (!message) {
    return;
  }


  try {

    button.disabled = true;

    button.textContent =
      "Envoi...";

    status.textContent = "";


    if (!currentUser) {

      const {
        data: {
          user
        }
      } =
        await supabaseClient.auth.getUser();

      currentUser = user;
    }


    if (!currentUser) {

      throw new Error(
        "Utilisateur non connecté."
      );
    }


    const {
      error
    } = await supabaseClient
      .from("public_chat_messages")
      .insert({

        user_id:
          currentUser.id,

        message:
          message

      });


    if (error) {
      throw error;
    }


    input.value = "";

    status.textContent =
      "✅ Message envoyé";

    await loadMessages();


    setTimeout(() => {

      status.textContent = "";

    }, 2000);

  }

  catch (error) {

    console.error(
      "SEND CHAT ERROR:",
      error
    );


    status.textContent =
      "❌ " + error.message;

    status.className =
      "error";

  }

  finally {

    button.disabled = false;

    button.textContent =
      "Envoyer";
  }
}


/* =========================
   REALTIME
========================= */

function subscribeToMessages() {

  try {

    supabaseClient
      .channel("public-chat")
      .on(
        "postgres_changes",
        {
          event: "*",
          schema: "public",
          table: "public_chat_messages"
        },
        function(payload) {

          console.log(
            "Nouveau changement:",
            payload
          );

          loadMessages();

        }
      )
      .subscribe();

  }

  catch (error) {

    console.error(
      "REALTIME ERROR:",
      error
    );

  }
}


/* =========================
   INIT
========================= */

async function initChat() {

  try {

    if (!window.supabaseClient) {

      throw new Error(
        "supabaseClient n'est pas disponible. Vérifiez app.js."
      );

    }


    await loadMessages();

    subscribeToMessages();

  }

  catch (error) {

    console.error(
      "INIT CHAT ERROR:",
      error
    );

  }
}


/* =========================
   FORM
========================= */

document
  .getElementById("chatForm")
  .addEventListener(
    "submit",
    function(event) {

      event.preventDefault();

      sendMessage();

    }
  );


/* =========================
   START
========================= */

if (
  document.readyState === "loading"
) {

  document.addEventListener(
    "DOMContentLoaded",
    initChat
  );

} else {

  initChat();

}

</script>

</body>
</html>
