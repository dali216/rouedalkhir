<script>

const SUPABASE_URL =
  "https://iimzsfbkgugbqkipsdih.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_JFAxVtAkqUWJ1XSmhk7TZw_xPyT13dY";


const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY,
    {
      auth: {
        persistSession: true,
        autoRefreshToken: true,
        detectSessionInUrl: true,
        storage: window.localStorage
      }
    }
  );


let currentUser = null;
let messagesLoaded = false;


/* =========================
   AUTH
========================= */

async function checkAuth() {

  const {
    data: {
      user
    }
  } =
    await supabaseClient.auth.getUser();


  if (!user) {

    window.location.href =
      "login.html";

    return false;
  }


  currentUser = user;

  return true;
}


/* =========================
   LOAD MESSAGES
========================= */

async function loadMessages() {

  const {
    data,
    error
  } =
    await supabaseClient
      .from("public_chat_messages")
      .select(`
        id,
        user_id,
        message,
        created_at,
        profiles (
          full_name
        )
      `)
      .order(
        "created_at",
        {
          ascending: true
        }
      );


  if (error) {

    console.error(
      "CHAT ERROR:",
      error
    );

    document.getElementById(
      "empty"
    ).innerHTML =
      "❌ Erreur de chargement du chat.";

    return;
  }


  const chatBox =
    document.getElementById(
      "chatBox"
    );


  chatBox.innerHTML = "";


  if (!data || data.length === 0) {

    chatBox.innerHTML =
      `<div class="empty">
        💬 Aucun message pour le moment.<br>
        Soyez le premier à écrire !
      </div>`;

    messagesLoaded = true;

    return;
  }


  data.forEach(
    addMessage
  );


  messagesLoaded = true;


  scrollToBottom();
}


/* =========================
   ADD MESSAGE
========================= */

function addMessage(msg) {

  const chatBox =
    document.getElementById(
      "chatBox"
    );


  const wrapper =
    document.createElement(
      "div"
    );


  const isMine =
    msg.user_id ===
    currentUser.id;


  wrapper.className =
    "message " +
    (isMine ? "mine" : "");


  const bubble =
    document.createElement(
      "div"
    );

  bubble.className =
    "bubble";


  const sender =
    document.createElement(
      "div"
    );

  sender.className =
    "sender";


  if (isMine) {

    sender.textContent =
      "Vous";

  } else {

    sender.textContent =
      msg.profiles?.full_name ||
      "Membre";
  }


  const text =
    document.createElement(
      "div"
    );

  text.className =
    "text";

  text.textContent =
    msg.message;


  const time =
    document.createElement(
      "div"
    );

  time.className =
    "time";


  const date =
    new Date(
      msg.created_at
    );


  time.textContent =
    date.toLocaleString(
      "fr-FR",
      {
        day: "2-digit",
        month: "2-digit",
        hour: "2-digit",
        minute: "2-digit"
      }
    );


  bubble.appendChild(
    sender
  );

  bubble.appendChild(
    text
  );
