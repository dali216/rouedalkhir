<!doctype html>
<html lang="fr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">

  <title>Profil bénévole — Roued Al Khair</title>

  <link rel="stylesheet" href="style.css">

  <style>
    .profile-page {
      max-width: 700px;
      margin: 80px auto;
      padding: 20px;
    }

    .profile-card {
      text-align: center;
      padding: 40px 25px;
    }

    .profile-avatar {
      width: 110px;
      height: 110px;
      margin: 0 auto 20px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 34px;
      font-weight: 800;
      background: #e2e8f0;
      color: #0f172a;
    }

    .profile-name {
      font-size: 32px;
      margin: 10px 0;
    }

    .profile-role {
      display: inline-block;
      padding: 7px 14px;
      border-radius: 20px;
      background: #e2e8f0;
      font-size: 13px;
      margin-bottom: 25px;
    }

    .profile-info {
      display: grid;
      gap: 12px;
      margin-top: 25px;
      text-align: left;
    }

    .info-item {
      padding: 15px;
      border-radius: 14px;
      background: rgba(255,255,255,.08);
    }

    .info-item small {
      display: block;
      color: #64748b;
      margin-bottom: 4px;
    }

    .loading {
      text-align: center;
      padding: 50px;
    }
  </style>
</head>

<body>

<header class="nav-wrap">

  <nav class="nav glass">

    <a class="brand" href="index.html">
      <span class="logo">RK</span>
      <span>Roued <b>Al Khair</b></span>
    </a>

  </nav>

</header>


<main class="profile-page">

  <div
    id="loading"
    class="glass loading"
  >
    ⏳ Chargement du profil...
  </div>


  <div
    id="profile"
    class="glass profile-card"
    style="display:none"
  >

    <div
      class="profile-avatar"
      id="avatar"
    >
      RK
    </div>


    <h1
      class="profile-name"
      id="name"
    >
      —
    </h1>


    <div
      class="profile-role"
      id="role"
    >
      Bénévole
    </div>


    <div class="profile-info">

      <div class="info-item">

        <small>
          Statut
        </small>

        <strong>
          ✅ Membre de Roued Al Khair
        </strong>

      </div>


      <div class="info-item">

        <small>
          Membre depuis
        </small>

        <strong id="date">
          —
        </strong>

      </div>

    </div>

  </div>


  <div
    id="error"
    class="glass loading"
    style="display:none"
  >
    ❌ Profil introuvable.
  </div>

</main>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
  "https://iimzsfbkgugbqkipsdih.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_JFAxVtAkqUWJ1XSmhk7TZw_xPyT13dY";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


// =====================================
// GET USER ID FROM QR URL
// =====================================

const params =
  new URLSearchParams(
    window.location.search
  );

const userId =
  params.get("id");


// =====================================
// LOAD PROFILE
// =====================================

async function loadProfile() {

  if (!userId) {

    showError();

    return;
  }


  const {
    data,
    error
  } =
    await supabaseClient
      .from("profiles")
      .select(
        "id, full_name, role, created_at"
      )
      .eq("id", userId)
      .maybeSingle();


  console.log(
    "PROFILE:",
    data
  );


  if (error) {

    console.error(error);

    showError();

    return;
  }


  if (!data) {

    showError();

    return;
  }


  const name =
    data.full_name ||
    "Bénévole";


  document.getElementById("name")
    .textContent =
    name;


  document.getElementById("avatar")
    .textContent =

    name
      .split(" ")
      .map(x => x[0])
      .join("")
      .slice(0,2)
      .toUpperCase();


  document.getElementById("role")
    .textContent =

    data.role === "admin"
      ? "Administrateur"
      : "Bénévole";


  if (data.created_at) {

    document.getElementById("date")
      .textContent =

      new Date(
        data.created_at
      ).toLocaleDateString(
        "fr-FR"
      );

  }


  document.getElementById("loading")
    .style.display =
    "none";


  document.getElementById("profile")
    .style.display =
    "block";

}


// =====================================
// ERROR
// =====================================

function showError() {

  document.getElementById("loading")
    .style.display =
    "none";

  document.getElementById("error")
    .style.display =
    "block";

}


loadProfile();

</script>

</body>
</html>
